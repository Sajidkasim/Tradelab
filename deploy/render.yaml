# Optional deployment recipe. Saving this file does not create or buy a service.
# Review the selected compute plan's price in Render before creating the service.
services:
  - type: web
    name: primuslab-web
    runtime: docker
    branch: codex/react-rebuild
    dockerfilePath: ./Dockerfile.web
    dockerContext: .
    region: frankfurt
    plan: standard
    numInstances: 1
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: PRIMUSLAB_PUBLIC_URL
        sync: false
      - key: TRADELAB_DB_URL
        sync: false
      - key: PRIMUSLAB_PASSWORD_HASH
        sync: false
      - key: PRIMUSLAB_SESSION_SECRET
        generateValue: true
