name: Matrix snapshot
on:
  schedule:
    # Mon-Fri: London Open (07:15 UTC), NY Pre-Market (12:30 UTC), Post-NY Open (15:05 UTC), NY Close (21:30 UTC)
    - cron: "15 7,12,15,21 * * 1-5"
    # Friday post-CFTC COT release (22:37 UTC)
    - cron: "37 22 * * 5"
  workflow_dispatch:
    inputs:
      source:
        description: Snapshot section to refresh
        type: choice
        options: [all, fred, cot, markets, calendar]
        default: all
concurrency:
  group: matrix-snapshot
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install 'requests>=2.32,<3' 'psycopg[binary]>=3.1,<4'
      - run: python tools/refresh_matrix.py "$MATRIX_SOURCE"
        env:
          PYTHONPATH: .
          MATRIX_SOURCE: ${{ inputs.source || (github.event.schedule == '37 22 * * 5' && 'cot' || 'all') }}
          MATRIX_SUPABASE_URL: ${{ secrets.MATRIX_SUPABASE_URL }}
          MATRIX_DB_URL: ${{ secrets.MATRIX_DB_URL }}
          MATRIX_SUPABASE_SERVICE_KEY: ${{ secrets.MATRIX_SUPABASE_SERVICE_KEY }}
          MATRIX_FMP_API_KEY: ${{ secrets.MATRIX_FMP_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          MATRIX_DISABLE_ICE_SPREAD: ${{ vars.MATRIX_DISABLE_ICE_SPREAD }}
