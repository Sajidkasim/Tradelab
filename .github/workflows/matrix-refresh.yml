name: Matrix snapshot
on:
  schedule:
    - cron: "17 13,22 * * 1-5"
    - cron: "37 22 * * 5"
    - cron: "7,22,37,52 12-16 * * 1-5"
  workflow_dispatch:
    inputs:
      source:
        description: Snapshot section to refresh
        type: choice
        options: [fred, cot, calendar]
        default: fred
permissions:
  contents: read
concurrency:
  group: matrix-snapshot
  cancel-in-progress: false
jobs:
  refresh:
    if: github.event.schedule != '7,22,37,52 12-16 * * 1-5' || vars.MATRIX_ENABLE_FMP_CALENDAR == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/react-rebuild
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install 'requests>=2.32,<3' 'psycopg[binary]>=3.1,<4'
      - run: python tools/refresh_matrix.py "$MATRIX_SOURCE"
        env:
          MATRIX_SOURCE: ${{ inputs.source || (github.event.schedule == '37 22 * * 5' && 'cot' || github.event.schedule == '7,22,37,52 12-16 * * 1-5' && 'calendar' || 'fred') }}
          MATRIX_DB_URL: ${{ secrets.MATRIX_DB_URL }}
          MATRIX_FMP_API_KEY: ${{ secrets.MATRIX_FMP_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          MATRIX_ENABLE_ICE_SPREAD: ${{ vars.MATRIX_ENABLE_ICE_SPREAD }}
