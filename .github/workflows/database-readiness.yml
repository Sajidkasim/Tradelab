name: Database readiness
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}
permissions: {}
jobs:
  probe:
    if: vars.PRIMUS_READY_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check database readiness
        env:
          READY_URL: ${{ vars.PRIMUS_READY_URL }}
        run: |
          curl --proto '=https' --fail --silent --show-error --max-time 8 "$READY_URL" |
            jq -e '.status == "ready"'
