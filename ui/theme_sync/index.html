<!doctype html>
<html><head><meta charset="utf-8"></head><body>
<script>
// Streamlit's component render event reports theme changes immediately.
let previous;
const send = (type, payload = {}) => parent.postMessage({isStreamlitMessage: true, type, ...payload}, '*');
window.addEventListener('message', event => {
  if (event.source !== parent || event.data.type !== 'streamlit:render') return;
  const theme = event.data.theme?.base;
  if ((theme === 'light' || theme === 'dark') && theme !== previous) {
    previous = theme;
    send('streamlit:setComponentValue', {value: theme, dataType: 'json'});
  }
  send('streamlit:setFrameHeight', {height: 0});
});
send('streamlit:componentReady', {apiVersion: 1});
</script>
</body></html>
